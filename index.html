<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        <h1>Adicionar Tarefas</h1>
        <form>
            <div id="adicionandoTarefa">
                <input id="inputTarefa" type="text" placeholder="Digite uma tarefa">
                <select name="prioridades" id="prioridades">
                    <option value="alta" id="optionAlta">Alta</option>
                    <option value="media" id="optionMedia">Media</option>
                    <option value="baixa" id="optionBaixa">Baixa</option>
                </select>
            </div>
            <button type="button" id="buttonAdicionar">Adicionar</button>
            <p id="mensagem">Adicione tarefas a lista!</p> 
        </form>
        <div id="contador">
        <p class="tarefaContador">Total:
            <span id="total">0</span>
        </p>
        <p class="tarefaContador">Pendentes:
            <span id="pendentes">0</span>
        </p>
        <p class="tarefaContador">Concluídas:
            <span id="concluidas">0</span>
        </p>
        </div>
    </div>
    <div id="containerLista">
        <h2>Lista de tarefas</h2>
        <div id="botoes">
            <button type="button" id="btnTodas" class="botaoLista">Todas</button>
            <button type="button" id="btnPendentes"  class="botaoLista">Pendentes</button>
            <button type="button" id="btnConcluidas" class="botaoLista">Concluídas</button>
        </div>
        <ul id="listaTarefas">
        </ul>
    </div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
